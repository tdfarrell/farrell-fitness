name: Test and deploy to Bluehost

# Every push to main runs the tests, then uploads changed files to Bluehost over FTPS.
# Set these repository secrets (Settings > Secrets and variables > Actions):
#   FTP_SERVER     e.g. ftp.yourdomain.com  (cPanel > FTP Accounts > Configure FTP Client)
#   FTP_USERNAME   e.g. deploy@yourdomain.com
#   FTP_PASSWORD
#   FTP_SERVER_DIR folder relative to the FTP account's home, ending in /, e.g. public_html/fit/ or ./
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: pdo_sqlite, curl, mbstring
      - name: PHP syntax check
        run: find . -name '*.php' -not -path './.git/*' -print0 | xargs -0 -n1 php -l
      - name: Expenditure engine tests
        run: node tests/tdee.test.mjs
      - name: Food and WHOOP parser tests
        run: php tests/parsers_test.php

  deploy:
    needs: test
    runs-on: ubuntu-latest
    env:
      FTP_SERVER: ${{ secrets.FTP_SERVER }}
    steps:
      - name: Check deploy settings
        if: env.FTP_SERVER == ''
        run: echo "::notice::Deploy skipped. Add the FTP_SERVER, FTP_USERNAME, FTP_PASSWORD and FTP_SERVER_DIR repository secrets to turn on automatic deploys."
      - uses: actions/checkout@v5
        if: env.FTP_SERVER != ''
      - name: Stamp the build so installed apps pick up the new version
        if: env.FTP_SERVER != ''
        run: sed -i "s/__BUILD__/${GITHUB_SHA::8}/" sw.js
      - name: Upload changed files
        if: env.FTP_SERVER != ''
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          server-dir: ${{ secrets.FTP_SERVER_DIR }}
          protocol: ftps
          port: 21
          exclude: |
            **/.git*
            **/.git*/**
            **/node_modules/**
            .github/**
            tests/**
            README.md
            DEPLOY.md
            api/config.php
            data/*.sqlite*
